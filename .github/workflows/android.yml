name: Android HU-EN (released engine)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare verified v0.5.4 native libraries and runtime assets
        run: |
          curl --fail --location --retry 3 \
            https://github.com/codepdbh/nfsmw-android/releases/download/v0.5.4/NFSMW-Android-Evolved-v0.5.4-arm64.apk \
            --output "$RUNNER_TEMP/upstream.apk"
          python tools/prepare_android_prebuilt.py --apk "$RUNNER_TEMP/upstream.apk"
      - name: Build and test ARM64 UI without rebuilding the engine
        working-directory: android
        run: ./gradlew -PreuseNative=true assembleRelease testReleaseUnitTest --no-daemon
      - name: Verify unchanged engine, signing and alignment
        run: |
          python tools/verify_android_prebuilt.py \
            --upstream-apk "$RUNNER_TEMP/upstream.apk" \
            --test-apk android/app/build/outputs/apk/release/app-release.apk \
            --report out/HU-EN-runtime-check.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nfsmw-hu-en-arm64-test
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            out/HU-EN-runtime-check.json
